name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app (generates chord data + static export)
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate app icons from resources/icon.png
        run: npm run gen:icons

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chord-book-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # --- Release signing (only runs once the repo secrets below are set) ---
      # Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. See android/keystore.properties.example.
      - name: Check for release signing secrets
        id: signing_check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.signing_check.outputs.has_secrets == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write keystore.properties
        if: steps.signing_check.outputs.has_secrets == 'true'
        run: |
          cat > android/keystore.properties << EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        if: steps.signing_check.outputs.has_secrets == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK artifact
        if: steps.signing_check.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chord-book-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
